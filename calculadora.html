<body>

    <main class="principal">
        <section class ="calculadora">
            <h3>Simulador de Pontos</h3>
            <div>
          <div class="form-grid">
            <label> Arroz (5 kg)- 10 pontos</label>
            <input type="number" id="arroz" min="0">
          </div>

          <div class="form-group">
            <label> Feijão (5 kg)- 8 pontos</label>
            <input type="number" id="feijao" min="0">
          </div>

          <div class="form-group">
            <label> Macarrão (500g)- 5 pontos</label>
            <input type="number" id="macarrao" min="0">
          </div>
        </div>
          <button type="button" onclick="calcular()">Calcular Pontos</button>
          <div class="resultado" id="resultado"> pontuação total: 0 pontos</div>
        </section>
    </main>

    <footer>
        <p>Coordenação Trote Solidário 2026: trotesolidário@facef.br</p>
        <p>Uni-FACEF - Centro Universitário Municipal de Franca</p>
    </footer>

    <script>
    function calcular() {
        let arroz = Number(document.getElementById('arroz').value);
        let feijao = Number(document.getElementById('feijao').value);
        let macarrao = Number(document.getElementById('macarrao').value);

        let pontos = (arroz * 10) + (feijao * 8) + (macarrao * 5);
        document.getElementById('resultado').textContent = `pontuação total: ${pontos} pontos`;

    }
    </script>
</body>
